services:
  - type: web
    name: secure-messenger-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m alembic upgrade head"
    startCommand: "python -m uvicorn server.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: secure-messenger-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173"

databases:
  - name: secure-messenger-db
    plan: free
